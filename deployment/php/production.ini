[PHP]
; 💡 核心基础设置
variables_order = "EGPCS"
expose_php = Off
max_execution_time = 60
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On

; 🛡️ 安全防御加固 (防 RCE 脚本调用与远程文件包含)
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,popen,proc_nice,dl,show_source,posix_kill,posix_mkfifo,posix_setpgid,posix_setsid,posix_setuid

; 🛡️ 请求与上传防护 (防止针对引擎级 OOM 内存破坏构造的异常大包与畸变参数)
post_max_size = 25M
upload_max_filesize = 20M
max_input_vars = 3000
max_input_time = 60

; 🚀 内存优化（24G 内存非常充裕，单个 Worker 限制放宽到 1G，防止处理大文件或复杂报表时溢出）
memory_limit = 1G

; 🛡️ 会话与 Cookie 严格模式
session.use_strict_mode = 1
session.cookie_httponly = 1

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1

; 🚀 修正点：将 512MB 改为 512M
opcache.memory_consumption = 512M

; 🚀 修正点：根据官方规范，字符串区直接写纯数字 64（代表 64MB）
opcache.interned_strings_buffer = 64

opcache.max_accelerated_files = 30000

; 性能榨干设置
opcache.validate_timestamps = 0
opcache.preload_user = www-data

; ⚡ ARM64 绝配：PHP 8.4 高性能 JIT
opcache.jit = tracing
; 🚀 修正点：将 128MB 改为 128M
opcache.jit_buffer_size = 128M
