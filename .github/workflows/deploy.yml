name: 🚀 生产环境自动化部署 (极速优化版)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 任务 1: 在 GitHub 服务器上构建 Docker 镜像并推送
  # ==========================================
  build-and-push:
    # 💡 核心加速 1：使用 GitHub 针对开源仓库免费开放的原生 ARM64 Runner
    # 原生运行无需 QEMU 模拟，Vite 编译和依赖解析速度提升数倍
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 💡 核心加速 2：因为使用了原生 ARM64 Runner，已彻底删除耗时 10 秒的 setup-qemu-action！

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送到 GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/teslalyon/laravel13-react:latest
          # 💡 核心加速 3：由 mode=max 改为 mode=min，避免全量上传数百兆中间层，上传缓存省下约 15 秒
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # 💡 核心加速 4：关闭无用的构建来源证明，减少摘要元数据打包耗时
          provenance: false

  # ==========================================
  # 任务 2: 自动增量同步静态素材到 Cloudflare R2
  # ==========================================
  sync-assets-to-r2:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 增量同步 public/images 至 Cloudflare R2
        # 仅当配置了 R2_ENDPOINT 密钥时执行，容错跳过
        if: env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if ! command -v aws &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y awscli
          fi

          echo "🚀 开始向 Cloudflare R2 增量同步静态资源..."
          # 利用 AWS CLI S3 协议向 R2 增量同步，配置 1 年强缓存 Header
          aws s3 sync public/images s3://${R2_BUCKET}/images \
            --endpoint-url ${R2_ENDPOINT} \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress
          echo "✅ Cloudflare R2 静态资源同步完成！"

  # ==========================================
  # 任务 3: 登录服务器拉取镜像并平滑重启
  # ==========================================
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: 登录服务器并更新
        uses: appleboy/ssh-action@v1.2.5
        env:
          TEMP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: TEMP_GH_TOKEN,PROD_ENV_CONTENT
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }} || exit

            echo "🔄 正在强制同步最新的服务器配置文件..."
            git fetch --all
            git reset --hard origin/main

            echo "📁 确保宿主机持久化日志与文件存储目录存在并赋予完全读写权限（不丢失历史数据）..."
            mkdir -p storage/logs storage/app/public/avatars
            sudo -n chmod -R 777 storage/logs storage/app/public 2>/dev/null || chmod -R 777 storage/logs storage/app/public 2>/dev/null || true

            echo "📝 正在全量注入生产环境变量..."
            echo "$PROD_ENV_CONTENT" > .env

            echo "🔐 正在使用一次性令牌登录 Docker 镜像库..."
            echo "$TEMP_GH_TOKEN" | docker login ghcr.io -u teslalyon --password-stdin

            echo "📥 正在拉取最新的 ARM64 镜像 (瘦身后仅需 1~2 秒)..."
            docker compose -f compose.prod.yaml pull app horizon

            # 🔥 核心修复：平滑退出必须在旧容器销毁前通知！
            # 允许旧容器处理完手头的队列任务，若未启动则容错忽略
            echo "🔄 正在通知当前旧 Horizon 队列服务平滑准备..."
            docker compose -f compose.prod.yaml exec -T horizon php artisan horizon:terminate || true

            echo "📦 正在无损更新应用容器与队列容器..."
            docker compose -f compose.prod.yaml up -d --no-deps app horizon

            echo "🔒 正在校准容器日志与存储目录权限及建立公共软链接..."
            docker compose -f compose.prod.yaml exec -T app php artisan storage:link --force || true
            docker compose -f compose.prod.yaml exec -T app chmod -R 777 /app/storage/logs /app/storage/app/public || true
            docker compose -f compose.prod.yaml exec -T horizon chmod -R 777 /app/storage/logs /app/storage/app/public || true

            echo "🗄️ 正在自动检测并执行数据库迁移 (Migration)..."
            docker compose -f compose.prod.yaml exec -T app php artisan migrate --force

            echo "⚡ 正在清空旧缓存并重新生成生产配置与路由缓存..."
            docker compose -f compose.prod.yaml exec -T app php artisan optimize:clear
            docker compose -f compose.prod.yaml exec -T app php artisan optimize
            docker compose -f compose.prod.yaml exec -T app php artisan view:cache

            echo "🔄 正在平滑重载 Octane Web 进程与 Horizon 队列进程..."
            docker compose -f compose.prod.yaml exec -T app php artisan octane:reload || true
            docker compose -f compose.prod.yaml exec -T horizon php artisan horizon:terminate || true

            docker logout ghcr.io
            docker image prune -f

            echo "✅ 极致安全的自动化部署完成！"
