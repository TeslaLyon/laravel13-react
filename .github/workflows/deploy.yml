name: 🚀 生产环境自动化部署 (极速优化版)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 任务 1: 在 GitHub 服务器上构建 Docker 镜像并推送
  # ==========================================
  build-and-push:
    # 💡 核心加速 1：使用 GitHub 针对开源仓库免费开放的原生 ARM64 Runner
    # 原生运行无需 QEMU 模拟，Vite 编译和依赖解析速度提升数倍
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 💡 核心加速 2：因为使用了原生 ARM64 Runner，已彻底删除耗时 10 秒的 setup-qemu-action！

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送到 GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/teslalyon/laravel13-react:latest
          # 💡 核心加速 3：由 mode=max 改为 mode=min，避免全量上传数百兆中间层，上传缓存省下约 15 秒
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # 💡 核心加速 4：关闭无用的构建来源证明，减少摘要元数据打包耗时
          provenance: false

  # ==========================================
  # 任务 2: 自动增量同步静态素材到 Cloudflare R2
  # ==========================================
  sync-assets-to-r2:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 增量同步 public/images 至 Cloudflare R2
        # 仅当配置了 R2_ENDPOINT 密钥时执行，容错跳过
        if: env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if ! command -v aws &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y awscli
          fi

          echo "🚀 开始向 Cloudflare R2 增量同步静态资源..."
          # 利用 AWS CLI S3 协议向 R2 增量同步，配置 1 年强缓存 Header
          aws s3 sync public/images s3://${R2_BUCKET}/images \
            --endpoint-url ${R2_ENDPOINT} \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress
          echo "✅ Cloudflare R2 静态资源同步完成！"

  # ==========================================
  # 任务 3: 登录服务器拉取镜像并平滑重启
  # ==========================================
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: 登录服务器并更新
        uses: appleboy/ssh-action@v1.2.5
        env:
          TEMP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: TEMP_GH_TOKEN,PROD_ENV_CONTENT
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }} || exit

            echo "🔄 正在同步最新的仓库配置..."
            git fetch --all
            git reset --hard origin/main

            echo "📁 确保宿主机持久化目录存在并设置必要权限..."
            mkdir -p storage/logs storage/app/public/avatars
            chmod 777 storage/logs storage/app/public storage/app/public/avatars 2>/dev/null || true

            echo "📝 注入生产环境变量..."
            echo "$PROD_ENV_CONTENT" > .env

            echo "🔐 登录 Docker 镜像库..."
            echo "$TEMP_GH_TOKEN" | docker login ghcr.io -u teslalyon --password-stdin

            echo "📥 正在预拉取最新的应用与队列镜像 (前台服务持续正常响应)..."
            docker compose -f compose.prod.yaml pull app horizon scheduler

            # 🌟 核心优化 1：数据库迁移前置！在旧版本容器还在运行对外服务时，静默升级数据库表结构（前台访问零中断）
            echo "🗄️ 在当前运行环境中平滑执行数据库迁移 (Migration)..."
            docker compose -f compose.prod.yaml exec -T app php artisan migrate --force || docker compose -f compose.prod.yaml run --rm --no-deps app php artisan migrate --force || true

            # 🌟 核心优化 2：优雅通知旧 Horizon 队列收拢正在处理的任务
            echo "🔄 优雅通知旧队列进程平滑准备..."
            docker compose -f compose.prod.yaml exec -T horizon php artisan horizon:terminate || true

            # 🌟 核心优化 3：极速切换容器（镜像已预拉取完毕，新容器启动时由 entrypoint 内部自动完成高质缓存编译）
            echo "📦 正在无损拉起全新应用容器..."
            docker compose -f compose.prod.yaml up -d --no-deps app horizon scheduler

            # 🌟 核心优化 4：健康检查探针实时轮询，精确确认新 Octane 服务已开始接受流量
            echo "🩺 等待新服务健康就绪探针响应..."
            for i in $(seq 1 20); do
              if docker compose -f compose.prod.yaml exec -T app curl -fs http://127.0.0.1:8000/up > /dev/null 2>&1; then
                echo "🎉 新应用容器已健康就绪 (响应 HTTP 200)，耗时约 ${i} 秒！"
                break
              fi
              sleep 1
            done

            # 🌟 核心优化 5：将耗时的 Meilisearch 搜索引擎索引同步移至后台异步执行，绝不阻塞主部署流程
            echo "🔍 后台异步同步搜索引擎规则..."
            docker compose -f compose.prod.yaml exec -d app php artisan scout:sync-index-settings || true

            docker logout ghcr.io
            docker image prune -f

            echo "✅ 真正的平滑零停机自动化部署完成！"
