name: 🚀 生产环境自动化部署 (极速优化版)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 任务 1: 在 GitHub 服务器上构建 Docker 镜像并推送
  # ==========================================
  build-and-push:
    # 💡 核心加速 1：使用 GitHub 针对开源仓库免费开放的原生 ARM64 Runner
    # 原生运行无需 QEMU 模拟，Vite 编译和依赖解析速度提升数倍
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 💡 核心加速 2：因为使用了原生 ARM64 Runner，已彻底删除耗时 10 秒的 setup-qemu-action！

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送到 GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/teslalyon/laravel13-react:latest
          # 💡 核心加速 3：由 mode=max 改为 mode=min，避免全量上传数百兆中间层，上传缓存省下约 15 秒
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # 💡 核心加速 4：关闭无用的构建来源证明，减少摘要元数据打包耗时
          provenance: false

  # ==========================================
  # 任务 2: 自动增量同步静态素材到 Cloudflare R2
  # ==========================================
  sync-assets-to-r2:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 增量同步 public/images 至 Cloudflare R2
        # 仅当配置了 R2_ENDPOINT 密钥时执行，容错跳过
        if: env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if ! command -v aws &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y awscli
          fi

          echo "🚀 开始向 Cloudflare R2 增量同步静态资源..."
          # 利用 AWS CLI S3 协议向 R2 增量同步，配置 1 年强缓存 Header
          aws s3 sync public/images s3://${R2_BUCKET}/images \
            --endpoint-url ${R2_ENDPOINT} \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress
          echo "✅ Cloudflare R2 静态资源同步完成！"

  # ==========================================
  # 任务 3: 登录服务器拉取镜像并平滑重启
  # ==========================================
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: 登录服务器并更新
        uses: appleboy/ssh-action@v1.2.5
        env:
          TEMP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: TEMP_GH_TOKEN,PROD_ENV_CONTENT
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }} || exit

            echo "🔄 正在同步最新的仓库配置..."
            git fetch --all
            git reset --hard origin/main

            echo "📁 确保宿主机持久化目录存在并设置必要权限..."
            mkdir -p storage/logs storage/app/public/avatars
            chmod 777 storage/logs storage/app/public storage/app/public/avatars 2>/dev/null || true

            echo "📝 注入生产环境变量..."
            echo "$PROD_ENV_CONTENT" > .env

            echo "🔐 登录 Docker 镜像库..."
            echo "$TEMP_GH_TOKEN" | docker login ghcr.io -u teslalyon --password-stdin

            # 🔍 检测当前活跃的蓝绿槽位
            if docker ps --format '{{.Names}}' | grep -q "^smzdk_app_blue$"; then
              ACTIVE_SLOT="blue"
              TARGET_SLOT="green"
            elif docker ps --format '{{.Names}}' | grep -q "^smzdk_app_green$"; then
              ACTIVE_SLOT="green"
              TARGET_SLOT="blue"
            else
              # 首次切换蓝绿部署（或旧版单容器模式）
              ACTIVE_SLOT="none"
              TARGET_SLOT="blue"
            fi

            echo "🔵 当前活跃槽位: ${ACTIVE_SLOT}"
            echo "🟢 本次部署槽位: ${TARGET_SLOT} (smzdk_app_${TARGET_SLOT})"

            echo "📥 正在预拉取最新的应用与队列镜像 (前台服务持续正常响应)..."
            docker compose -f compose.prod.yaml pull app_${TARGET_SLOT} horizon scheduler

            # 🌟 核心优化 1：数据库迁移前置！在旧版本容器还在运行对外服务时，静默升级数据库表结构（前台访问零中断）
            echo "🗄️ 平滑执行数据库迁移 (Migration)..."
            if [ "$ACTIVE_SLOT" != "none" ]; then
              docker compose -f compose.prod.yaml exec -T app_${ACTIVE_SLOT} php artisan migrate --force || docker compose -f compose.prod.yaml run --rm --no-deps app_${TARGET_SLOT} php artisan migrate --force || true
            else
              docker compose -f compose.prod.yaml run --rm --no-deps app_${TARGET_SLOT} php artisan migrate --force || true
            fi

            # 🌟 核心优化 2：优雅通知旧 Horizon 队列收拢正在处理的任务
            echo "🔄 优雅通知旧队列进程平滑准备..."
            docker compose -f compose.prod.yaml exec -T horizon php artisan horizon:terminate || true

            # 🌟 核心优化 3：启动全新目标槽位容器（旧容器完全不受影响，仍在持续对外处理流量）
            echo "📦 正在拉起新槽位容器: smzdk_app_${TARGET_SLOT}..."
            docker compose -f compose.prod.yaml up -d --no-deps app_${TARGET_SLOT} horizon scheduler

            # 🌟 核心优化 4：健康检查探针实时轮询，精确确认新 Octane 服务已开始接受流量
            echo "🩺 等待新槽位服务就绪探针响应 (/up)..."
            READY=false
            for i in $(seq 1 30); do
              if docker compose -f compose.prod.yaml exec -T app_${TARGET_SLOT} curl -fs http://127.0.0.1:8000/up > /dev/null 2>&1; then
                echo "🎉 新槽位 smzdk_app_${TARGET_SLOT} 已健康就绪 (响应 HTTP 200)，耗时约 ${i} 秒！"
                READY=true
                break
              fi
              sleep 1
            done

            if [ "$READY" != "true" ]; then
              echo "❌ 新槽位健康检查超时，部署终止，保持旧容器服务保证业务不中断！"
              docker compose -f compose.prod.yaml stop app_${TARGET_SLOT} || true
              exit 1
            fi

            # 稍作等待 2 秒确保 Caddy 的健康探针同步标记新容器为 HEALTHY
            sleep 2

            # 🌟 核心优化 5：安全下线并停止旧槽位容器（此时 Caddy 已平滑切流至 TARGET_SLOT）
            if [ "$ACTIVE_SLOT" != "none" ]; then
              echo "🛑 安全下线旧槽位容器: smzdk_app_${ACTIVE_SLOT}..."
              docker compose -f compose.prod.yaml stop app_${ACTIVE_SLOT} || true
              docker compose -f compose.prod.yaml rm -f app_${ACTIVE_SLOT} || true
            fi

            # 清理可能残余的旧单容器 laravel_app
            if docker ps -a --format '{{.Names}}' | grep -q "^laravel_app$"; then
              echo "🧹 清理旧版历史单容器 laravel_app..."
              docker stop laravel_app 2>/dev/null || true
              docker rm laravel_app 2>/dev/null || true
            fi

            # 🌟 核心优化 6：将耗时的 Meilisearch 搜索引擎索引同步移至后台异步执行，绝不阻塞主部署流程
            echo "🔍 后台异步同步搜索引擎规则..."
            docker compose -f compose.prod.yaml exec -d app_${TARGET_SLOT} php artisan scout:sync-index-settings || true

            docker logout ghcr.io
            docker image prune -f

            echo "✅ 真正的 Caddy 蓝绿零停机无缝切换部署完成！"
